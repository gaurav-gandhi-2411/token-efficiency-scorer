repos:
  - repo: local
    hooks:
      # AX2.2: a pre-commit hook can't know a PR's *intended* scope (that's
      # a human decision, not git-visible) -- but it can catch the cheap
      # proxy that bit twice in one session (2026-08-21): staging far more files than a single deliberate commit
      # normally touches, from a broad `git add` or a stale staged index
      # carried across a branch switch. Not a hard cap (LARGE_COMMIT_OK=1
      # opts in for genuinely large mechanical passes).
      - id: check-staged-scope
        name: Check staged file count against the usual single-commit size
        entry: python scripts/check_staged_scope.py
        language: system
        pass_filenames: false
        always_run: true
      - id: scan-secrets-pool
        name: Scan synthetic pool fixture for secrets
        entry: conda run -n base python scripts/scan_secrets.py --path tests/fixtures/synthetic_pool.jsonl
        language: system
        files: ^tests/fixtures/synthetic_pool\.jsonl$
        pass_filenames: false
      # AQ3: uv-locked ruff, not the astral-sh/ruff-pre-commit mirror repo
      # -- that mirror pins its own ruff version via a separate `rev:` tag
      # that can drift from uv.lock's own pin over time (two sources of
      # truth). `uv run ruff` always resolves to the exact version this
      # repo has locked. Sibling adk-tracegauge hit CI failures on ruff
      # findings a local run never caught three separate times before this
      # existed -- same fix applied here before it recurs in this repo too.
      - id: ruff-check
        name: ruff check (uv-locked version)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        # Byte-frozen (pyproject.toml extend-exclude); explicitly passed files bypass that exclude.
        exclude: ^tracegauge/_waste_detectors\.py$
      - id: ruff-format
        name: ruff format (uv-locked version)
        entry: uv run ruff format
        language: system
        types: [python]
        # Byte-frozen (pyproject.toml extend-exclude); explicitly passed files bypass that exclude.
        exclude: ^tracegauge/_waste_detectors\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # AW1/AW3: markdown-linebreak-ext preserves intentional trailing
      # double-space hard-breaks in .md files (used deliberately in
      # research/05-architecture-pivot.md's header block) instead of
      # silently stripping them -- caught when this hook kept re-stripping
      # an "immutable" research report's formatting on every commit attempt
      # that merely touched the file elsewhere.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements

  # Secret scan of the staged diff. Config (default rules + one narrow allowlist) is
  # .gitleaks.toml; the CI `secret-scan` job runs the same rules over the PR / full history.
  # Pinned to a release tag at least two weeks old, matching the CI job's gitleaks version.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
