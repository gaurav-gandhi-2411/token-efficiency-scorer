repos:
  - repo: local
    hooks:
      - id: scan-secrets-pool
        name: Scan pool data for secrets
        entry: conda run -n base python scripts/scan_secrets.py --path data/corpus_pool
        language: system
        files: ^data/corpus_pool/|^data/pool_
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
