name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # AW2: the 608-pre-existing-findings backlog this comment used to
      # describe is triaged and resolved -- ~93% was E402 (a structural
      # false-positive against this repo's own future-import-first
      # convention, permanently exempted via pyproject.toml's
      # [tool.ruff.lint] ignore), the rest was either safely autofixed
      # (ruff check --fix / ruff format, full test suite verified clean
      # before and after) or per-file-ignored where fixing correctly needed
      # real per-call judgment this pass didn't do (see pyproject.toml's
      # [tool.ruff.lint.per-file-ignores] comment). Now blocking, matching
      # the pre-commit hook's own (already-blocking) behavior.
      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      # Non-blocking: [tool.mypy] has declared strict=true since before this
      # workflow existed, but mypy was never actually runnable (numpy's
      # stubs need python_version >= 3.12, this project's config said 3.11 —
      # fixed here) and surfaces 125 pre-existing findings once it can run.
      # None introduced by this change; same tightening note as lint above.
      - name: Type check (mypy, informational)
        continue-on-error: true
        run: uv run mypy src/ tes/

      # UU1 (0.11.1): test_cluster_validity.py and test_chat_grounding.py's
      # TestContextFormatUnambiguous class used to be excluded here entirely
      # -- both read the real local ~/.claude/projects session history via
      # _load_real_corpus / get_or_compute_intelligence(no db_path), a
      # machine-state dependency no CI runner could ever satisfy. Fixed at
      # the test level instead of papering over it here:
      # test_chat_grounding.py's format-contract tests now use a synthetic,
      # always-valid cache dict (they test a pure dict -> str function, which
      # never needed a real DB); test_cluster_validity.py's real-corpus
      # quality checks now pytest.skip with a stated reason when the corpus
      # is too thin to evaluate, same pattern test_anomaly_threshold.py
      # already used correctly. Both files run unrestricted here now.
      - name: Unit tests
        run: |
          uv run pytest

  # The classifiers claim Python 3.10-3.14 while lint-and-test only ever ran 3.11 (audit D8,
  # 2026-10-07; its first run found the package did not import on 3.10, see CHANGELOG). This runs
  # the same suite on every other claimed version. It is a SEPARATE job, not a matrix on lint-and-test,
  # because renaming that job's check to "lint-and-test (3.11)" would orphan the required check
  # "lint-and-test" and block every merge. The legs are covered by the required aggregate check
  # "python-compat (every leg)" below.
  python-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Unit tests
        run: |
          uv run pytest

  # One check that is red if ANY python-compat leg is red. The legs are named "python-compat (3.10)" etc.;
  # requiring each by name would go stale the day a version is added or dropped, and a leg that is not
  # required cannot block a merge (adk-tracegauge found this on its first bot-opened PR, 2026-10-08: every
  # required check green, a new leg red, the merge gate "eligible"). This name is stable, so it can be a
  # required check that covers every leg, present and future.
  python-compat-all:
    name: python-compat (every leg)
    if: ${{ always() }}
    needs: [python-compat]
    runs-on: ubuntu-latest
    steps:
      - name: Every python-compat leg passed
        env:
          COMPAT_RESULT: ${{ needs.python-compat.result }}
        run: |
          echo "python-compat (all legs): $COMPAT_RESULT"
          [ "$COMPAT_RESULT" = "success" ]

  manifest-provenance:
    # 2026-08-05 audit: a metric in .portfolio/metrics.json without a
    # committed artifact behind it can silently drift from what the portfolio
    # site shows, with nobody able to tell -- this is a build failure, not a
    # warning. See gg-portfolio's provenance.md wave 19 section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Every manifest metric must have a committed artifact
        run: python scripts/check_manifest_provenance.py

  # The README is the PyPI project page, and PyPI resolves a relative link (LICENSE, docs/x.md,
  # assets/x.svg) against pypi.org, where it 404s. tracegauge 0.1.0-0.13.0 and adk-tracegauge
  # 0.1.0rc1-0.7.0 shipped with 2-10 such links each (release-correctness audit, 2026-10-08), and a
  # README edit is exactly the kind of change nothing else in CI looks at. This renders it with
  # readme_renderer (the library PyPI uses) and fails on a relative link or a dead in-page anchor.
  readme-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the renderer PyPI uses
        run: pip install "readme-renderer[md]==43.0"

      - name: The README renders and has no link that is dead on pypi.org
        run: python scripts/check_readme_pypi.py README.md

      # Proves the check can still fail: a checker that quietly stopped finding anything would
      # keep this job green forever.
      - name: The check still rejects a known-bad README
        run: |
          if python scripts/check_readme_pypi.py tests/fixtures/readme_dead_links.md; then
            echo "check_readme_pypi.py accepted a README with dead links"
            exit 1
          fi
