name: Bug report
description: Something in tracegauge behaved incorrectly, crashed, or produced a wrong number.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This package fails closed on purpose (an unresolvable model
        returns `priced=False, total_usd=0.0` rather than a guessed price) — if you hit an
        actionable error message instead of a crash, that's probably working as intended. This
        template is for genuine bugs: wrong numbers, unhandled crashes, or behavior that
        contradicts the README/docstrings.

  - type: input
    id: version
    attributes:
      label: tracegauge version
      description: "`tes --version`"
      placeholder: "0.13.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen (a specific number, status, or output)?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened -- the full traceback or the actual (wrong) output, not a summary.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The smallest command or script that reproduces this. Include the session file/path
        shape if this is about a wrong score or dollar figure (redact real content -- see
        PRIVACY.md; a shape/structure description is usually enough).
      render: bash
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the CHANGELOG for a breaking-change note matching my version jump (see the 0.10.2 pricing-defect entry for an example of a behavior change that looked like a bug but was documented).
          required: true
