<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TES Dashboard</title>
  <style>
    body { font-family: monospace; max-width: 1100px; margin: 2rem auto; color: #222; padding: 0 1rem; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1.5rem; text-decoration: none; color: #0066cc; }
    nav a:hover { text-decoration: underline; }
    h1 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1rem; margin-top: 1.5rem; border-bottom: 1px solid #ccc; padding-bottom: 0.2rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { text-align: left; padding: 0.3rem 0.6rem; border-bottom: 1px solid #e8e8e8; font-size: 0.9rem; }
    th { background: #f5f5f5; }
    a { color: #0066cc; }
    .tag-unavailable { color: #888; font-style: italic; }
    .tag-stale { color: #b8860b; }
    .tag-current { color: #006400; }
    .tag-above { color: #cc4400; }
    .tag-below { color: #006400; }
    .tag-within { color: #333; }
    .caveat { background: #f9f9f9; border-left: 3px solid #ccc; padding: 0.5rem 0.7rem; font-size: 0.82em; margin: 0.4rem 0 0.8rem; color: #444; }
    .proof-turn { font-size: 0.82em; color: #555; margin-left: 1rem; }
    .stale-note { color: #b8860b; font-size: 0.85em; font-style: italic; }
    pre { background: #f5f5f5; padding: 0.5rem; font-size: 0.82em; overflow-x: auto; }
    .empty { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Sessions</a>
    <a href="/trends">Trends</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
