<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tracegauge{% block title_suffix %}{% endblock %}</title>
  <style>
    /* ── reset ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── base typography ─────────────────────────────────────────── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: #111827;
      background: #f8f9fa;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #374151;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.3rem;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
    }

    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── nav ─────────────────────────────────────────────────────── */
    nav.nav {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      height: 52px;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-brand {
      font-size: 0.875rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.01em;
      text-decoration: none;
      margin-right: 2.5rem;
    }
    .nav-brand span { color: #9ca3af; font-weight: 400; }

    .nav-links { display: flex; }

    .nav-links a {
      color: #6b7280;
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0 0.875rem;
      height: 52px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      transition: color 0.12s;
    }
    .nav-links a:hover { color: #111827; text-decoration: none; }
    .nav-links a.active { color: #111827; border-bottom-color: #111827; font-weight: 500; }

    /* ── page layout ─────────────────────────────────────────────── */
    .page { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    /* ── cards ───────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }

    /* ── sections ────────────────────────────────────────────────── */
    .section { margin-top: 2rem; }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }

    /* ── takeaway headline ───────────────────────────────────────── */
    .takeaway {
      font-size: 1rem;
      font-weight: 600;
      color: #111827;
      line-height: 1.5;
      padding: 0.9rem 1.25rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-left: 4px solid #111827;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5rem;
    }

    /* ── caveats (domain-of-validity) ────────────────────────────── */
    .caveat {
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 0.55rem 0.9rem;
      font-size: 0.8rem;
      color: #475569;
      border-radius: 0 4px 4px 0;
      margin: 0.5rem 0 1rem;
      line-height: 1.55;
    }

    /* ── metric box ──────────────────────────────────────────────── */
    .metric-box {
      background: #eff6ff;
      border-left: 3px solid #3b82f6;
      padding: 0.6rem 0.9rem;
      border-radius: 0 4px 4px 0;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .metric-highlight { font-size: 1.05rem; font-weight: 700; color: #166534; }
    .metric-old { font-size: 0.85rem; color: #9ca3af; }

    /* ── badges (.badge-*) ───────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 0.15em 0.55em;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .badge-unavailable { background: #f3f4f6; color: #9ca3af; font-weight: 400; font-style: italic; }
    .badge-above       { background: #fef3c7; color: #92400e; }
    .badge-within      { background: #f3f4f6; color: #374151; }
    .badge-below       { background: #dcfce7; color: #166534; }
    .badge-self        { background: #dcfce7; color: #166534; font-weight: 700; }
    .badge-building    { background: #fef3c7; color: #92400e; }
    .badge-corpus      { background: #f3f4f6; color: #9ca3af; font-style: italic; }
    .badge-current     { background: #dcfce7; color: #166534; }
    .badge-stale       { background: #fef3c7; color: #92400e; }

    /* ── inline tag equivalents (existing content template names) ── */
    .tag-unavailable { color: #9ca3af; font-style: italic; }
    .tag-stale       { color: #92400e; }
    .tag-current     { color: #166534; }
    .tag-above       { color: #92400e; }   /* amber, NOT red */
    .tag-below       { color: #166534; }
    .tag-within      { color: #374151; }
    .tag-self        { color: #166534; font-weight: 700; }
    .tag-building    { color: #92400e; }
    .tag-corpus      { color: #9ca3af; font-style: italic; }

    /* ── tables ──────────────────────────────────────────────────── */
    table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }

    th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }

    td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; }

    /* ── cost / metric values ────────────────────────────────────── */
    .cost-amount     { font-weight: 600; font-variant-numeric: tabular-nums; }
    .cost-approx     { color: #d97706; font-size: 0.78em; margin-left: 0.25rem; }
    .cost-above      { color: #d97706; font-size: 0.8em; margin-left: 0.25rem; }
    .cost-below      { color: #16a34a; font-size: 0.8em; margin-left: 0.25rem; }
    .cost-no-baseline { color: #9ca3af; font-size: 0.8em; margin-left: 0.25rem; }
    .cost-provenance  { font-size: 0.75em; color: #9ca3af; margin-top: 0.3rem; }

    /* ── misc ────────────────────────────────────────────────────── */
    .empty          { color: #9ca3af; font-style: italic; font-size: 0.875rem; }
    .proof-turn     { font-size: 0.8em; color: #6b7280; }
    .stale-note     { color: #d97706; font-size: 0.85em; font-style: italic; margin-top: 0.5rem; }
    .waste-indicator { color: #d97706; font-weight: 600; }
    .mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.82em;
    }
    .text-muted { color: #6b7280; }
    .text-faint { color: #9ca3af; }

    pre {
      background: #f8f9fa;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 0.6rem 0.75rem;
      font-size: 0.78rem;
      overflow-x: auto;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.84em;
      background: #f3f4f6;
      padding: 0.1em 0.35em;
      border-radius: 3px;
    }

    details summary {
      cursor: pointer;
      user-select: none;
      font-size: 0.875rem;
      color: #374151;
      font-weight: 500;
      padding: 0.4rem 0;
      list-style: none;
    }
    details summary::before { content: '▶ '; font-size: 0.7em; color: #9ca3af; }
    details[open] summary::before { content: '▼ '; }
    details[open] summary { margin-bottom: 0.75rem; }

    /* ── sortable table headers ──────────────────────────────────── */
    th.sortable a {
      color: #6b7280;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    th.sortable a:hover { color: #111827; }
    th.sortable.sort-active a { color: #111827; }
    .sort-arrow { font-size: 0.65rem; color: #9ca3af; }
    th.sortable.sort-active .sort-arrow { color: #111827; }

    /* ── Ask panel ───────────────────────────────────────────────── */
    .ask-panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-top: 1.5rem;
    }
    .ask-panel h2 { margin-top: 0; }
    .ask-input-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .ask-input {
      flex: 1;
      padding: 0.45rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
    }
    .ask-input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px #dbeafe; }
    .ask-btn {
      padding: 0.45rem 1.1rem;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .ask-btn:hover { background: #1f2937; }
    .ask-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .ask-answer {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 0.875rem;
      line-height: 1.65;
      white-space: pre-wrap;
      min-height: 3rem;
    }
    .ask-answer.error { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
    .ask-answer.thinking { color: #9ca3af; font-style: italic; }
    .ask-consent-row {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    /* ── archetype cards ─────────────────────────────────────────── */
    .archetype-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 0.75rem;
    }
    .archetype-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .archetype-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #111827;
      margin-bottom: 0.3rem;
    }
    .archetype-meta {
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 0.65rem;
    }
    .archetype-bar-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.2rem;
      font-size: 0.78rem;
    }
    .archetype-bar-label { width: 130px; flex-shrink: 0; color: #374151; }
    .archetype-bar-track {
      flex: 1;
      height: 8px;
      background: #f3f4f6;
      border-radius: 4px;
      overflow: hidden;
    }
    .archetype-bar-fill { height: 100%; background: #3b82f6; border-radius: 4px; }
    .archetype-bar-fill.waste { background: #f59e0b; }
    .archetype-bar-value { width: 40px; text-align: right; color: #6b7280; }

    /* ── status chips ────────────────────────────────────────────── */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2em 0.65em;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-chip.ok    { background: #dcfce7; color: #166534; }
    .status-chip.warn  { background: #fef3c7; color: #92400e; }
    .status-chip.off   { background: #f3f4f6; color: #9ca3af; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .status-dot.ok  { background: #16a34a; }
    .status-dot.warn { background: #d97706; }
    .status-dot.off  { background: #d1d5db; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-brand">tracegauge <span>dashboard</span></a>
    <div class="nav-links">
      <a href="/" {% if request.endpoint in ('session_list', 'session_detail') %}class="active"{% endif %}>Sessions</a>
      <a href="/patterns" {% if request.endpoint == 'patterns' %}class="active"{% endif %}>Patterns</a>
      <a href="/trends" {% if request.endpoint == 'trends' %}class="active"{% endif %}>Trends</a>
      <a href="/baseline-status" {% if request.endpoint == 'baseline_status' %}class="active"{% endif %}>Baseline Status</a>
      <a href="/budget" {% if request.endpoint == 'budget' %}class="active"{% endif %}>Budget</a>
      <a href="/monitor" {% if request.endpoint == 'monitor' %}class="active"{% endif %}>Live Monitor</a>
    </div>
  </nav>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
