[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegauge"
version = "0.12.3"
description = "Three-axis efficiency scoring for Claude Code sessions — token economy, trajectory quality, deterministic waste. Local by default; nothing transmitted unless you opt in to the content-free community baseline."
authors = [{ name = "Gaurav Gandhi", email = "gaurav.gandhi2411@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-APACHE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
keywords = ["claude-code", "llm", "token-efficiency", "coding-agent", "ai-tools"]
dependencies = [
    "flask>=3.0,<4",
    "httpx>=0.27,<1",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
]

[dependency-groups]
# Wave 15 (gg-portfolio) — this repo had no declared dev dependencies at all;
# lint/type-check/test were only ever run against a global/conda environment,
# never reproducibly. Needed to make CI (added this same change) actually work.
dev = [
    "ruff>=0.15,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    # tests/test_public_adapter.py + scripts/public_trace_adapter.py (the
    # opt-in community-corpus feature) read/write parquet via pandas.
    "pandas>=2.0,<3",
    "pyarrow>=15,<21",
]

[project.urls]
Repository = "https://github.com/gaurav-gandhi-2411/token-efficiency-scorer"

[project.scripts]
tes = "tes.cli:main"
tracegauge = "tes.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tes*"]
exclude = ["tests*", "scripts*", "src*"]

[tool.setuptools.package-data]
"tes" = ["data/cc_baselines.json", "data/prices.json", "data/quickstart_sample_session.jsonl", "web/templates/*.html", "web/static/brand/*.svg", "web/static/fonts/*.woff2"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tes"]
# tes/_waste_detectors.py is a project invariant: byte-frozen since B4
# (tests/test_prior_features_intact.py::test_waste_detectors_byte_frozen
# enforces `git diff --exit-code` on it), so it must never be touched by
# `ruff check --fix` or `ruff format` -- AW2's repo-wide autofix pass caught
# this the hard way (reformatted it, broke the frozen-file test, reverted).
extend-exclude = ["tes/_waste_detectors.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E402: this repo's own convention (CLAUDE.md rule 1) puts
# `from __future__ import annotations` before the module docstring, which
# pycodestyle's E402 reads as "imports after a statement" for every import
# that follows -- 608 pre-existing findings across 118/174 files, confirmed
# by direct sampling to be ~93% this exact structural pattern (the remainder
# are a handful of frozen, one-off release-verification scripts under
# scripts/ that deliberately interleave imports with sequential executable
# checks -- also not a real defect). AW2: decided as a permanent config
# exemption rather than reordering 118 files' docstrings (would violate
# rule 1) or accumulating one-off `noqa`s PR by PR (the anti-pattern this
# decision exists to end).
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
# AW2: pre-existing findings that are NOT the E402 structural artifact above
# -- genuine, individually-judged minor issues (unstrict zip(), unused loop
# vars, ambiguous single-letter names, suppressible exceptions, etc.) that
# would need real per-call review to fix correctly (e.g. B905's strict=True
# vs strict=False requires knowing whether each zipped pair is guaranteed
# equal length) rather than mechanical cleanup. Scoped per-file, not
# rule-level, so the same rule still catches NEW violations in code these
# files gain later, and in every other file. Fixed instead where trivial
# and low-risk (F821 in tes/intelligence/cache.py; see git history) --
# this list is deliberately the residual after that, not the whole backlog.
"scripts/**/*.py" = ["B905", "F841", "E741", "SIM105", "B007", "SIM102", "SIM103", "SIM110", "E701", "SIM118", "SIM117"]
"tests/**/*.py" = ["B905", "F841", "E741", "SIM105", "B007", "SIM102", "SIM103", "SIM110", "E701", "SIM118", "SIM117"]
"tes/**/*.py" = ["B905", "F841", "E741", "SIM105", "B007", "SIM102", "SIM103", "SIM110", "E701", "SIM118", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
pythonpath = [".", "src", "scripts"]

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "notebooks/*"]

[tool.coverage.report]
fail_under = 0
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
