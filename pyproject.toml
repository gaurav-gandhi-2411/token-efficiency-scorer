[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegauge"
version = "0.10.0"
description = "Three-axis efficiency scoring for Claude Code sessions — token economy, trajectory quality, deterministic waste. Local by default; nothing transmitted unless you opt in to the content-free community baseline."
authors = [{ name = "Gaurav Gandhi", email = "gaurav.gandhi2411@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
keywords = ["claude-code", "llm", "token-efficiency", "coding-agent", "ai-tools"]
dependencies = [
    "flask>=3.0,<4",
    "httpx>=0.27,<1",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
]

[dependency-groups]
# Wave 15 (gg-portfolio) — this repo had no declared dev dependencies at all;
# lint/type-check/test were only ever run against a global/conda environment,
# never reproducibly. Needed to make CI (added this same change) actually work.
dev = [
    "ruff>=0.15,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    # tests/test_public_adapter.py + scripts/public_trace_adapter.py (the
    # opt-in community-corpus feature) read/write parquet via pandas.
    "pandas>=2.0,<3",
    "pyarrow>=15,<21",
]

[project.urls]
Repository = "https://github.com/gaurav-gandhi-2411/token-efficiency-scorer"

[project.scripts]
tes = "tes.cli:main"
tracegauge = "tes.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tes*"]
exclude = ["tests*", "scripts*", "src*"]

[tool.setuptools.package-data]
"tes" = ["data/cc_baselines.json", "data/prices.json", "web/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
pythonpath = [".", "src", "scripts"]

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "notebooks/*"]

[tool.coverage.report]
fail_under = 0
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
